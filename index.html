  const taskLink=id=>id&&S.tasks[id]&&!S.tasks[id].deleted?html`<button type="button" className="linkish" onClick=${e=>{e.stopPropagation();openTask(id)}}>задача${isDone(S.tasks[id])?' ✓':''} →</button>`:null;
  return html`<div className=${cls('op',past&&'past')} role="button" tabIndex="0" onClick=${()=>openModal({type:'opening',id:o.id})} onKeyDown=${e=>{if(e.key==='Enter')openModal({type:'opening',id:o.id})}}>
    <div className="op-date">${d?html`<b>${d.getDate()}</b><span>${MON_S[d.getMonth()]}</span>`:html`<span>—</span>`}</div>
    <div style=${{minWidth:0}}><div className="op-t">${o.name}</div><div className="op-s">${[o.brand,o.city,o.address].filter(Boolean).join(' · ')}</div>
      <div className="op-pills"><span className=${cls('pill',o.type==='franchise'?'pink':'green')}>${o.type==='franchise'?'Франшиза':'Наша'}</span><span className=${cls('due',st.k)}>${st.t}</span>${o.lineCount?html`<span className="pill">${o.lineCount} ${plural(Number(o.lineCount),'людина','людини','людей')} у лінійку</span>`:null}</div></div>
    <div className="op-rec"><small>Рекрутинг лінійки</small><span className=${'rs '+ln.k}>${ln.t}</span>${taskLink(o.lineTaskId)}</div>
    <div className="op-rec"><small>Адміністратор</small><span className=${'rs '+ad.k}>${o.adminExists?'✓ ':''}${ad.t}</span>${!o.adminExists&&taskLink(o.adminTaskId)}</div>
    <div className="op-who">${o.recruiterId?html`<${Avatar} id=${o.recruiterId} size=${30}/>`:null}</div>
  </div>`}
function OpeningsPage(){const [tab,setTab]=useState('upcoming');const [type,setType]=useState('');const td=today();
  const all=Object.values(S.openings);
  const inTab=o=>tab==='all'||(tab==='upcoming'?(!o.openDate||o.openDate>=td):(o.openDate&&o.openDate<td));
  const list=all.filter(o=>inTab(o)&&(!type||o.type===type)).sort((a,b)=>{const x=a.openDate||'9999',y=b.openDate||'9999';return tab==='opened'?(x<y?1:-1):(x<y?-1:x>y?1:0)});
  const cnt=t=>all.filter(o=>t==='all'||(t==='upcoming'?(!o.openDate||o.openDate>=td):(o.openDate&&o.openDate<td))).length;
  return html`<div style=${{maxWidth:1200}}>
    <div className="ph"><div><h1>Відкриття</h1><p>Нові точки мережі: дата відкриття, старт рекрутингу лінійки та адміністратора.</p></div><span className="sp"></span>
      ${canWrite()&&html`<button type="button" className="btn primary" onClick=${()=>openModal({type:'opening'})}><${I} n="plus" s=${16}/>Нове відкриття</button>`}</div>
    <div style=${{display:'flex',gap:12,alignItems:'center',flexWrap:'wrap',marginBottom:16}}>
      <div className="tabs" style=${{marginBottom:0,flex:'1 1 auto'}}>${[['upcoming','Майбутні'],['opened','Відкриті'],['all','Усі']].map(([id,n])=>html`<button type="button" key=${id} className=${cls(tab===id&&'on')} onClick=${()=>setTab(id)}>${n} <span className="muted">${cnt(id)}</span></button>`)}</div>
      <div className="seg">${[['','Усі'],['own','Наші'],['franchise','Франшиза']].map(([v,n])=>html`<button type="button" key=${v||'x'} className=${cls(type===v&&'on')} onClick=${()=>setType(v)}>${n}</button>`)}</div>
    </div>
    ${!list.length?html`<div className="empty">${all.length?'Немає відкриттів у цьому розділі.':'Ще немає жодного відкриття. Натисніть «Нове відкриття», щоб додати першу точку.'}</div>`:html`<div className="ops">${list.map(o=>html`<${OpeningRow} key=${o.id} o=${o}/>`)}</div>`}
  </div>`}
function UpcomingOpenings(){const td=today();const list=Object.values(S.openings).filter(o=>o.openDate&&o.openDate>=td).sort((a,b)=>a.openDate<b.openDate?-1:1).slice(0,4);
  if(!list.length)return null;
  return html`<section className="box full"><h2 className="sec-t">Найближчі відкриття <span className="n">${list.length}</span><span style=${{flex:1}}></span><button type="button" className="btn ghost sm" onClick=${()=>go({v:'openings'})}>Усі відкриття<${I} n="right" s=${14}/></button></h2>
    <div className="ops">${list.map(o=>html`<${OpeningRow} key=${o.id} o=${o}/>`)}</div></section>`}
async function createOpeningTasks(oid){const o=S.openings[oid];if(!o)return;
  const board=visBoards().find(b=>/recruit|рекрут/i.test(b.name))||visBoards()[0];if(!board){toast('Немає дошки для задач','err');return}
  const lbl=labelById('recruitment')?['recruitment']:[];const who=o.recruiterId?[o.recruiterId]:[];
  const near=o.openDate&&diffDays(o.openDate,today())<=30;
  const info=`Відкриття: ${o.openDate?fmtDY(o.openDate):'—'} · ${o.type==='franchise'?'франшиза':'наша точка'}${o.brand?' · '+o.brand:''}${o.city?' · '+o.city:''}${o.address?', '+o.address:''}`;
  const patch={};let made=0;
  if(!o.lineTaskId||!S.tasks[o.lineTaskId]||S.tasks[o.lineTaskId].deleted){
    const id=await createTask({title:`Рекрутинг лінійки — ${o.name}`,boardId:board.id,assignees:who,due:o.openDate||'',priority:near?'high':'mid',labels:lbl,
      desc:`${info}\nСтарт рекрутингу: ${o.lineStart?fmtDY(o.lineStart):'—'}${o.lineCount?`\nПотрібно людей: ${o.lineCount}`:''}${o.notes?`\n\n${o.notes}`:''}`,
      checklist:['Погодити кількість людей і графік','Опублікувати вакансії','Провести співбесіди','Оформити працівників','Навчання до відкриття'].map(t=>({id:rid(),text:t,done:false}))});
    if(id){patch.lineTaskId=id;made++}}
  if(!o.adminExists&&(!o.adminTaskId||!S.tasks[o.adminTaskId]||S.tasks[o.adminTaskId].deleted)){
    const id=await createTask({title:`Рекрутинг адміністратора — ${o.name}`,boardId:board.id,assignees:who,due:o.openDate||'',priority:near?'crit':'high',labels:lbl,
      desc:`${info}\nСтарт рекрутингу: ${o.adminStart?fmtDY(o.adminStart):'—'}${o.notes?`\n\n${o.notes}`:''}`,
      checklist:['Погодити профіль адміністратора','Опублікувати вакансію','Провести співбесіди','Офер і оформлення','Онбординг до відкриття'].map(t=>({id:rid(),text:t,done:false}))});
    if(id){patch.adminTaskId=id;made++}}
  if(made){await save('openings',oid,patch);toast(`Створено ${made} ${plural(made,'задачу','задачі','задач')} на дошці «${board.name}»`)}else toast('Задачі рекрутингу вже створено')}
function OpeningModal({id}){const o=id?S.openings[id]:null;
  const [f,setF]=useState({name:o?o.name:'',brand:o?(o.brand||''):BRANDS[0],city:o?(o.city||''):'',address:o?(o.address||''):'',type:o?(o.type||'own'):'own',openDate:o?(o.openDate||''):'',
    lineStart:o?(o.lineStart||''):'',lineCount:o?(o.lineCount||''):'',adminExists:o?!!o.adminExists:false,adminStart:o?(o.adminStart||''):'',recruiterId:o?(o.recruiterId||''):'',notes:o?(o.notes||''):''});
  const [busy,setBusy]=useState(false);const set=(k,v)=>setF({...f,[k]:v});const w=canWrite();
  async function persist(){const data={...f,name:f.name.trim(),city:f.city.trim(),address:f.address.trim(),notes:f.notes.trim(),updatedAt:nowIso()};
    if(o){return (await save('openings',o.id,data))?o.id:null}
    const nid=DB.collection('openings').doc().id;return (await save('openings',nid,{...data,createdAt:nowIso(),authorId:S.meId},true))?nid:null}
  async function submit(e){e.preventDefault();if(!f.name.trim())return;const sid=await persist();if(sid){toast(o?'Збережено':'Відкриття додано');closeModal()}}
  async function withTasks(){if(!f.name.trim()){toast('Вкажіть назву точки','err');return}setBusy(true);const sid=await persist();if(sid)await createOpeningTasks(sid);setBusy(false);closeModal()}
  async function del(){await remove('openings',o.id);closeModal();toast('Відкриття видалено')}
  const hasTasks=o&&((o.lineTaskId&&S.tasks[o.lineTaskId])||(o.adminTaskId&&S.tasks[o.adminTaskId]));
  return html`<${Modal} title=${o?'Відкриття':'Нове відкриття'} onClose=${closeModal} wide=${true}><form className="modal-b" onSubmit=${submit}>
    <label className="field"><span>Назва точки</span><input id="op-name" className="inp" autoFocus required disabled=${!w} value=${f.name} onChange=${e=>set('name',e.target.value)} placeholder="Напр.: Адміністратор Івано-Франківськ, ТРЦ «Велес»"/></label>
    <div className="grid2">
      <label className="field"><span>Бренд</span><select id="op-brand" className="sel" disabled=${!w} value=${f.brand} onChange=${e=>set('brand',e.target.value)}><option value="">—</option>${BRANDS.map(b=>html`<option key=${b} value=${b}>${b}</option>`)}</select></label>
      <div className="field"><span>Тип</span><div className="seg" role="group" aria-label="Тип точки">${[['own','Наша'],['franchise','Франшиза']].map(([v,n])=>html`<button type="button" key=${v} disabled=${!w} className=${cls(f.type===v&&'on')} onClick=${()=>set('type',v)}>${n}</button>`)}</div></div>
      <label className="field"><span>Місто</span><input id="op-city" className="inp" disabled=${!w} value=${f.city} onChange=${e=>set('city',e.target.value)} placeholder="Івано-Франківськ"/></label>
      <label className="field"><span>Адреса (необовʼязково)</span><input id="op-addr" className="inp" disabled=${!w} value=${f.address} onChange=${e=>set('address',e.target.value)}/></label>
      <label className="field"><span>Дата відкриття</span><input id="op-open" type="date" className="inp" disabled=${!w} value=${f.openDate} onChange=${e=>set('openDate',e.target.value)}/></label>
      <label className="field"><span>Відповідальний рекрутер</span><select id="op-rec" className="sel" disabled=${!w} value=${f.recruiterId} onChange=${e=>set('recruiterId',e.target.value)}><option value="">— не призначено —</option>${users().map(u=>html`<option key=${u.id} value=${u.id}>${u.name}</option>`)}</select></label>
    </div>
    <div className="box" style=${{padding:14,display:'flex',flexDirection:'column',gap:12,background:'var(--surface-2)',border:0}}>
      <b style=${{fontSize:13}}>Лінійний персонал</b>
      <div className="grid2">
        <label className="field"><span>Старт рекрутингу лінійки</span><input id="op-line" type="date" className="inp" disabled=${!w} value=${f.lineStart} onChange=${e=>set('lineStart',e.target.value)}/></label>
        <label className="field"><span>Скільки людей потрібно (необовʼязково)</span><input id="op-count" type="number" min="0" className="inp" disabled=${!w} value=${f.lineCount} onChange=${e=>set('lineCount',e.target.value)}/></label>
      </div>
      <b style=${{fontSize:13,marginTop:4}}>Адміністратор</b>
      <label className="check-row"><input id="op-adm" type="checkbox" disabled=${!w} checked=${f.adminExists} onChange=${e=>set('adminExists',e.target.checked)}/>Адміністратор уже є</label>
      ${!f.adminExists&&html`<label className="field" style=${{maxWidth:280}}><span>Старт рекрутингу адміністратора</span><input id="op-admd" type="date" className="inp" disabled=${!w} value=${f.adminStart} onChange=${e=>set('adminStart',e.target.value)}/></label>`}
    </div>
    <label className="field"><span>Нотатки</span><textarea id="op-notes" className="inp" rows="2" disabled=${!w} value=${f.notes} onChange=${e=>set('notes',e.target.value)} placeholder="Графік роботи, контакт партнера, особливості…"/></label>
    ${hasTasks&&html`<div className="hint">Задачі рекрутингу: ${o.lineTaskId&&S.tasks[o.lineTaskId]?html`<button type="button" className="linkish" onClick=${()=>{closeModal();openTask(o.lineTaskId)}}>лінійка →</button>`:null} ${o.adminTaskId&&S.tasks[o.adminTaskId]?html`<button type="button" className="linkish" onClick=${()=>{closeModal();openTask(o.adminTaskId)}}>адміністратор →</button>`:null}</div>`}
    ${w&&html`<div className="modal-f"><button type="submit" className="btn primary">${o?'Зберегти':'Додати відкриття'}</button>
      <button type="button" className="btn" disabled=${busy} onClick=${withTasks} title="Створить задачі на дошці Recruitment і надішле лист рекрутеру">${busy?'Створюю…':o?'Зберегти й створити задачі рекрутингу':'Додати й створити задачі рекрутингу'}</button>
      <span className="sp"></span>${o&&html`<${Confirm} label="Видалити" confirm="Видалити відкриття?" onYes=${del} icon="trash"/>`}</div>`}
  </form><//>`}

function UserForm({id,self,onDone}){const u=id?S.users[id]:null;const [f,setF]=useState({name:u?u.name:'',title:u?u.title:'',email:u?u.email:'',role:u?u.role:'user',color:u?u.color:UCOL[Object.keys(S.users).length%UCOL.length],photo:u?u.photo:''});const [busy,setBusy]=useState(false);const inp=useRef(null);
  const set=(k,v)=>setF({...f,[k]:v});
  async function upPhoto(file){if(!file)return;if(!/^image\//.test(file.type)){toast('Оберіть зображення','err');return}setBusy(true);try{const r=await uploadAsset(file);set('photo',r.id)}catch(e){toast(upErr(e,file.name),'err')}setBusy(false)}
  async function submit(e){e.preventDefault();if(!f.name.trim())return;const data={...f,name:f.name.trim(),title:f.title.trim(),email:f.email.trim()};if(self&&!isAdmin())data.role=u.role;
    if(u){if(await save('users',u.id,data))toast('Збережено')}else{const nid=DB.collection('users').doc().id;if(await save('users',nid,{...data,claudeId:'',removed:false,order:Object.keys(S.users).length+1},true))toast('Користувача додано')}onDone&&onDone()}
  return html`<form className=${self?'box':''} onSubmit=${submit} style=${{display:'flex',flexDirection:'column',gap:14,maxWidth:self?560:'none'}}>
    <div style=${{display:'flex',gap:14,alignItems:'center'}}><${Avatar} u=${{...f,name:f.name||'?'}} size=${64}/><div style=${{display:'flex',gap:8,flexWrap:'wrap'}}>
      ${ASSETS&&html`<button type="button" className="btn sm" onClick=${()=>inp.current.click()} disabled=${busy}><${I} n="upload" s=${14}/>${busy?'Завантажую…':f.photo?'Змінити фото':'Завантажити фото'}</button><input ref=${inp} type="file" accept="image/*" hidden onChange=${e=>upPhoto(e.target.files[0])}/>`}
      ${f.photo&&html`<button type="button" className="btn ghost sm" onClick=${()=>set('photo','')}>Прибрати фото</button>`}</div></div>
    <div className="grid2"><label className="field"><span>Імʼя та прізвище</span><input className="inp" required value=${f.name} onChange=${e=>set('name',e.target.value)}/></label>

      <label className="field"><span>Email для входу</span><input className="inp" type="email" value=${f.email} disabled=${self&&!isAdmin()} onChange=${e=>set('email',e.target.value)}/></label>
      <label className="field"><span>Роль у системі</span><select className="sel" value=${f.role} disabled=${!isAdmin()} onChange=${e=>set('role',e.target.value)}><option value="user">User</option><option value="admin">Admin</option></select></label></div>
    <div className="field"><span>Колір аватара</span><div className="swatches">${UCOL.map(c=>html`<button type="button" key=${c} className=${cls('swatch',f.color===c&&'on')} style=${{background:c}} onClick=${()=>set('color',c)} aria-label=${'Колір '+c}></button>`)}</div></div>
    <div className="modal-f"><button type="submit" className="btn primary" disabled=${!canWrite()&&!self}>${u?'Зберегти':'Додати користувача'}</button></div>

      <${Confirm} className="icon-btn sm" label=${html`<${I} n="trash" s=${14}/>`} confirm="Так?" onYes=${()=>saveSettings({labels:ls_.filter(x=>x.id!==l.id)})}/></div>`)}
    <div className="addrow"><input className="inp sm" placeholder="Нова категорія" value=${nv} onChange=${e=>setNv(e.target.value)} onKeyDown=${e=>{if(e.key==='Enter'&&nv.trim()){saveSettings({labels:[...ls_,{id:rid(),name:nv.trim(),color:SWATCHES[ls_.length%SWATCHES.length]}]});setNv('')}}}/>
      <button type="button" className="btn sm" onClick=${()=>{if(nv.trim()){saveSettings({labels:[...ls_,{id:rid(),name:nv.trim(),color:SWATCHES[ls_.length%SWATCHES.length]}]});setNv('')}}}>Додати</button></div></div>`}
function RecurringList(){const list=Object.values(S.recurring).filter(r=>S.tasks[r.sourceId]&&!S.tasks[r.sourceId].deleted);
  return html`<div><p className="hint">Повторювані задачі створюються автоматично, коли хтось із команди відкриває систему в день повторення або пізніше. Налаштувати повторення можна в картці будь-якої задачі.</p>
    ${!list.length?html`<div className="empty">Повторюваних задач немає.</div>`:html`<div className="tbl-wrap"><table className="tbl"><thead><tr><th>Задача</th><th>Як часто</th><th>Наступна</th><th>Відповідальні</th><th></th></tr></thead><tbody>${list.map(r=>{const t=S.tasks[r.sourceId];return html`<tr key=${r.id} onClick=${()=>openTask(t.id)}>
      <td><b style=${{fontWeight:500}}>${t.title}</b><div className="hint">${(S.boards[t.boardId]||{}).name}</div></td><td>${freqName(r)}</td><td>${fmtDY(r.next)}</td><td><${Stack} ids=${assg(t)} size=${22}/></td>
      <td onClick=${e=>e.stopPropagation()} style=${{textAlign:'right'}}>${canEditTask(t)&&html`<${Confirm} label="Вимкнути" confirm="Вимкнути?" onYes=${()=>remove('recurring',r.id)}/>`}</td></tr>`})}</tbody></table></div>`}</div>`}
function HelpAccess(){return html`<div className="box" style=${{maxWidth:720,display:'flex',flexDirection:'column',gap:10,lineHeight:1.55}}>
  <h3 style=${{fontSize:15}}>Як працює вхід і доступ</h3>
  <p style=${{margin:0}}>Увійти може лише людина, чий email адміністратор додав у Налаштування → Користувачі. Колега відкриває сайт, натискає «Зареєструватися» і вводить цей самий email та свій пароль.</p>
  <p style=${{margin:0}}>Роль <b>Admin</b> керує дошками, користувачами й категоріями — це захищено правилами бази. Роль <b>User</b> працює із задачами: редагує свої, змінює статус, коментує, додає файли.</p>
  <p style=${{margin:0}}>Якщо колега забула пароль: адміністратор у Supabase (Authentication → Users) видаляє її акаунт входу, після чого вона реєструється знову з тим самим email. Профіль і задачі при цьому зберігаються.</p>
  <p style=${{margin:0}}>Нагадування про дедлайни, призначення та @згадки показуються у дзвіночку вгорі, коли людина відкриває систему.</p></div>`}
/* ================= modals ================= */
function BoardModal({id}){const b=id?S.boards[id]:null;const [f,setF]=useState({name:b?b.name:'',desc:b?b.desc:'',color:b?b.color:SWATCHES[0],members:b?(b.members||[]):[],status:b?b.status:'active'});const set=(k,v)=>setF({...f,[k]:v});
  async function submit(e){e.preventDefault();if(!f.name.trim())return;const data={...f,name:f.name.trim(),desc:f.desc.trim()};
    if(b){await save('boards',b.id,data);closeModal();return}
    const bid=DB.collection('boards').doc().id;const ord=Math.max(0,...Object.values(S.boards).map(x=>x.order||0))+1;
    if(await save('boards',bid,{...data,order:ord},true)){for(let i=0;i<DEFAULT_COLS.length;i++){const [n,k,c]=DEFAULT_COLS[i];await save('columns',bid+'-'+k,{boardId:bid,name:n,kind:k,color:c,order:i+1},true)}closeModal();go({v:'board',id:bid});toast('Дошку створено')}}
  async function del(){const tasks=Object.values(S.tasks).filter(t=>t.boardId===b.id&&!t.deleted);for(const t of tasks)await save('tasks',t.id,{deleted:true,deletedAt:nowIso()});
    for(const c of colsOf(b.id))await remove('columns',c.id);await remove('boards',b.id);closeModal();go({v:'boards'});toast('Дошку видалено')}
  return html`<${Modal} title=${b?'Налаштування дошки':'Нова дошка'} onClose=${closeModal}><form className="modal-b" onSubmit=${submit}>
    <label className="field"><span>Назва</span><input className="inp" autoFocus required value=${f.name} onChange=${e=>set('name',e.target.value)} placeholder="Напр.: L&D"/></label>
    <label className="field"><span>Опис</span><textarea className="inp" rows="2" value=${f.desc} onChange=${e=>set('desc',e.target.value)}/></label>
    <div className="field"><span>Колір обкладинки</span><${Swatches} value=${f.color} onChange=${v=>set('color',v)}/></div>
    <div className="field"><span>Учасники ${!f.members.length&&html`<b style=${{fontWeight:500}}>— уся команда</b>`}</span><div style=${{display:'flex',flexWrap:'wrap',gap:6,alignItems:'center'}}>${f.members.map(m=>html`<span key=${m} className="chip-user"><${Avatar} id=${m} size=${22}/>${uname(m)}<button type="button" onClick=${()=>set('members',f.members.filter(x=>x!==m))} aria-label=${'Прибрати '+uname(m)}>×</button></span>`)}<${UserPicker} value=${f.members} onChange=${v=>set('members',v)}/></div></div>
    ${b&&html`<label className="field"><span>Статус</span><select className="sel" value=${f.status} onChange=${e=>set('status',e.target.value)}><option value="active">Активна</option><option value="archived">Архівна</option></select></label>`}
    <div className="modal-f"><button type="submit" className="btn primary">${b?'Зберегти':'Створити дошку'}</button><span className="sp"></span>${b&&html`<${Confirm} label="Видалити дошку" confirm="Видалити дошку і її задачі?" onYes=${del} icon="trash"/>`}</div>
    ${!b&&html`<p className="hint" style=${{margin:0}}>Буде створено стандартні колонки: Backlog, To Do, In Progress, Waiting, Review, Done.</p>`}
  </form><//>`}
function ProjectModal({id}){const p=id?S.projects[id]:null;const [f,setF]=useState({name:p?p.name:'',desc:p?p.desc:'',ownerId:p?p.ownerId:S.meId,team:p?(p.team||[]):[],start:p?p.start:today(),due:p?p.due:'',status:p?p.status:'planning',color:p?p.color:SWATCHES[0]});const set=(k,v)=>setF({...f,[k]:v});
  async function submit(e){e.preventDefault();if(!f.name.trim())return;const data={...f,name:f.name.trim()};if(p){await save('projects',p.id,data);closeModal()}else{const pid=DB.collection('projects').doc().id;if(await save('projects',pid,data,true)){closeModal();go({v:'project',id:pid})}}}
  async function del(){for(const t of projTasks(p.id))await save('tasks',t.id,{projectId:''});await remove('projects',p.id);closeModal();go({v:'projects'})}
  return html`<${Modal} title=${p?'Редагувати проєкт':'Новий проєкт'} onClose=${closeModal} wide=${true}><form className="modal-b" onSubmit=${submit}>
    <label className="field"><span>Назва</span><input className="inp" autoFocus required value=${f.name} onChange=${e=>set('name',e.target.value)}/></label>
    <label className="field"><span>Опис</span><textarea className="inp" rows="3" value=${f.desc} onChange=${e=>set('desc',e.target.value)}/></label>
    <div className="grid2">
      <label className="field"><span>Owner</span><select className="sel" value=${f.ownerId} onChange=${e=>set('ownerId',e.target.value)}>${users().map(u=>html`<option key=${u.id} value=${u.id}>${u.name}</option>`)}</select></label>
      <label className="field"><span>Статус</span><select className="sel" value=${f.status} onChange=${e=>set('status',e.target.value)}>${PSTAT.map(s=>html`<option key=${s.id} value=${s.id}>${s.name}</option>`)}</select></label>
      <label className="field"><span>Дата початку</span><input type="date" className="inp" value=${f.start} onChange=${e=>set('start',e.target.value)}/></label>
      <label className="field"><span>Дедлайн</span><input type="date" className="inp" value=${f.due} onChange=${e=>set('due',e.target.value)}/></label></div>
    <div className="field"><span>Команда</span><div style=${{display:'flex',flexWrap:'wrap',gap:6,alignItems:'center'}}>${f.team.map(m=>html`<span key=${m} className="chip-user"><${Avatar} id=${m} size=${22}/>${uname(m)}<button type="button" onClick=${()=>set('team',f.team.filter(x=>x!==m))}>×</button></span>`)}<${UserPicker} value=${f.team} onChange=${v=>set('team',v)}/></div></div>
    <div className="field"><span>Колір</span><${Swatches} value=${f.color} onChange=${v=>set('color',v)}/></div>
    <div className="modal-f"><button type="submit" className="btn primary">${p?'Зберегти':'Створити проєкт'}</button><span className="sp"></span>${p&&html`<${Confirm} label="Видалити проєкт" confirm="Видалити? Задачі залишаться" onYes=${del} icon="trash"/>`}</div>
  </form><//>`}
function EventModal({id,date}){const ev=id?S.events[id]:null;const [f,setF]=useState({title:ev?ev.title:'',date:ev?ev.date:(date||today()),desc:ev?ev.desc:'',color:ev?ev.color:'#B0507E'});const set=(k,v)=>setF({...f,[k]:v});
  async function submit(e){e.preventDefault();if(!f.title.trim())return;if(ev)await save('events',ev.id,f);else await save('events',DB.collection('events').doc().id,{...f,by:S.meId},true);closeModal()}
  return html`<${Modal} title=${ev?'HR-подія':'Нова HR-подія'} onClose=${closeModal}><form className="modal-b" onSubmit=${submit}>
    <label className="field"><span>Назва</span><input className="inp" autoFocus required value=${f.title} disabled=${!canWrite()} onChange=${e=>set('title',e.target.value)} placeholder="Напр.: Корпоративне навчання"/></label>
    <label className="field"><span>Дата</span><input type="date" className="inp" required value=${f.date} disabled=${!canWrite()} onChange=${e=>set('date',e.target.value)}/></label>
    <label className="field"><span>Опис</span><textarea className="inp" rows="2" value=${f.desc} disabled=${!canWrite()} onChange=${e=>set('desc',e.target.value)}/></label>
    ${canWrite()&&html`<div className="modal-f"><button type="submit" className="btn primary">Зберегти</button><span className="sp"></span>${ev&&html`<${Confirm} label="Видалити" confirm="Видалити подію?" onYes=${()=>{remove('events',ev.id);closeModal()}} icon="trash"/>`}</div>`}
  </form><//>`}
function ModalHost(){const m=S.modal;if(!m)return null;
  if(m.type==='board')return html`<${BoardModal} key=${'b'+(m.id||'new')} id=${m.id}/>`;
  if(m.type==='project')return html`<${ProjectModal} key=${'p'+(m.id||'new')} id=${m.id}/>`;
  if(m.type==='opening')return html`<${OpeningModal} key=${'o'+(m.id||'new')} id=${m.id}/>`;
  if(m.type==='event')return html`<${EventModal} key=${'e'+(m.id||'new')} id=${m.id} date=${m.date}/>`;
  if(m.type==='user')return html`<${Modal} title=${m.id?'Редагувати користувача':'Новий користувач'} onClose=${closeModal}><div className="modal-b"><${UserForm} id=${m.id} onDone=${closeModal}/></div><//>`;
  return null}

/* ================= auth screens ================= */
function authErr(e){const m=(e&&e.message)||'';return /invalid login/i.test(m)?'Невірний email або пароль.':/already registered|already exists/i.test(m)?'Цей email уже зареєстровано — увійдіть.':/password/i.test(m)&&/6|short|least/i.test(m)?'Пароль має містити щонайменше 6 символів.':/not confirmed/i.test(m)?'Спершу підтвердьте email за посиланням у листі.':/rate|too many/i.test(m)?'Забагато спроб. Зачекайте хвилину.':/fetch|network/i.test(m)?'Немає звʼязку з сервером. Перевірте інтернет.':(m||'Не вдалося увійти.')}
function GateShell({children}){return html`<div className="gate"><div className="gate-card" style=${{width:'min(460px,100%)'}}>
  <div className="gate-top"><div className="logo" style=${{width:44,height:44,fontSize:14}}>LC</div><div><h1>Lviv Croissants HR</h1><p>Робочий простір HR-відділу</p></div></div>
  <div className="gate-b">${children}</div></div><${Toasts}/></div>`}
function AuthScreen(){const [mode,setMode]=useState('in');const [f,setF]=useState({email:'',password:'',name:''});const [busy,setBusy]=useState(false);const [msg,setMsg]=useState(null);
  const set=(k,v)=>setF({...f,[k]:v});
  async function submit(e){e.preventDefault();setBusy(true);setMsg(null);
    try{if(mode==='in'){const {error}=await sb.auth.signInWithPassword({email:f.email.trim(),password:f.password});if(error)throw error}
      else{const {data,error}=await sb.auth.signUp({email:f.email.trim(),password:f.password,options:{data:{full_name:f.name.trim()},emailRedirectTo:location.origin+location.pathname}});if(error)throw error;if(!data.session)setMsg({ok:true,text:'Акаунт створено. Підтвердьте email за посиланням у листі, потім увійдіть.'})}}
    catch(err){setMsg({text:authErr(err)})}setBusy(false)}
  async function google(){const {error}=await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+location.pathname}});if(error)setMsg({text:authErr(error)})}
  return html`<${GateShell}>
    <div className="seg" style=${{alignSelf:'flex-start'}}><button type="button" className=${cls(mode==='in'&&'on')} onClick=${()=>{setMode('in');setMsg(null)}}>Вхід</button><button type="button" className=${cls(mode==='up'&&'on')} onClick=${()=>{setMode('up');setMsg(null)}}>Реєстрація</button></div>
    <form onSubmit=${submit} style=${{display:'flex',flexDirection:'column',gap:12}}>
      ${mode==='up'&&html`<label className="field"><span>Імʼя та прізвище</span><input id="au-name" className="inp" autoComplete="name" value=${f.name} onChange=${e=>set('name',e.target.value)}/></label>`}
      <label className="field"><span>Робочий email</span><input id="au-email" className="inp" type="email" required autoComplete="email" value=${f.email} onChange=${e=>set('email',e.target.value)} placeholder="name@lvivcroissants.com"/></label>
      <label className="field"><span>Пароль</span><input id="au-pass" className="inp" type="password" required minLength="6" autoComplete=${mode==='in'?'current-password':'new-password'} value=${f.password} onChange=${e=>set('password',e.target.value)}/></label>
      ${msg&&html`<div className=${msg.ok?'banner':'banner'} style=${msg.ok?{background:'var(--ok-soft)',color:'var(--ok)'}:{background:'var(--red-soft)',color:'var(--red)'}} role="alert">${msg.text}</div>`}
      <button type="submit" className="btn primary" style=${{justifyContent:'center',padding:'10px 14px'}} disabled=${busy}>${busy?'Зачекайте…':mode==='in'?'Увійти':'Зареєструватися'}</button>
    </form>
    ${GOOGLE_LOGIN&&html`<button type="button" className="btn" style=${{justifyContent:'center'}} onClick=${google}>Увійти через Google</button>`}
    <p className="hint" style=${{margin:0}}>${mode==='in'?'Немає акаунта? Оберіть «Реєстрація» і вкажіть email, який вам додав адміністратор.':'Реєструйтеся з тим email, який адміністратор додав у систему. Пароль — щонайменше 6 символів.'}</p>
  <//>`}
function NoAccess(){return html`<${GateShell}>
  <h2 style=${{fontSize:16,fontWeight:600}}>Доступ ще не надано</h2>
  <p style=${{margin:0,lineHeight:1.55}}>Ви увійшли як <b>${S.viewer&&S.viewer.email}</b>, але цього email немає серед користувачів системи. Попросіть адміністратора HR-відділу додати його в Налаштування → Користувачі, потім натисніть «Перевірити ще раз».</p>
  <div style=${{display:'flex',gap:8,flexWrap:'wrap'}}><button type="button" className="btn primary" onClick=${()=>location.reload()}>Перевірити ще раз</button><button type="button" className="btn" onClick=${signOut}>Вийти</button></div>
<//>`}
function ConfigScreen(){return html`<${GateShell}>
  <h2 style=${{fontSize:16,fontWeight:600}}>Сайт ще не підключено до бази</h2>
  <p style=${{margin:0,lineHeight:1.55}}>Відкрийте файл <b>index.html</b> у текстовому редакторі та вставте на початку скрипта <b>SUPABASE_URL</b> і <b>SUPABASE_ANON_KEY</b> зі свого проєкту Supabase (Project Settings → API). Покрокова інструкція — у файлі ІНСТРУКЦІЯ.</p>
<//>`}
/* ================= app ================= */
function App(){useStore();
  useEffect(()=>{const f=()=>{readHash();emit()};window.addEventListener('hashchange',f);return()=>window.removeEventListener('hashchange',f)},[]);
  if(S.phase==='config')return html`<${ConfigScreen}/>`;
  if(!S.phase)return html`<div className="loading"><div><div className="spin" style=${{margin:'0 auto 10px'}}></div>Підключаюсь…</div></div>`;
  if(S.phase==='auth')return html`<${AuthScreen}/>`;
  const L=S.loaded;if(!(L.users&&L.boards&&L.columns&&L.tasks&&L.settings))return html`<div className="loading"><div><div className="spin" style=${{margin:'0 auto 10px'}}></div>Завантажую дані…</div></div>`;
  if(!S.meId)return html`<${NoAccess}/>`;
  const r=S.route;let page,flush=false;
  if(r.v==='board'){page=html`<${BoardView} key=${r.id} id=${r.id}/>`;flush=true}
  else if(r.v==='my'){page=html`<${MyTasks}/>`}
  else if(r.v==='notebook'){page=html`<${NotebookPage}/>`}
  else if(r.v==='projects')page=html`<${ProjectsPage}/>`;
  else if(r.v==='openings')page=html`<${OpeningsPage}/>`;
  else if(r.v==='project')page=html`<${ProjectView} id=${r.id}/>`;
  else if(r.v==='boards')page=html`<${BoardsPage}/>`;
  else if(r.v==='calendar')page=html`<${Fragment}><div className="ph"><div><h1>Календар</h1><p>Дедлайни задач і проєктів, HR-події та відкриття точок.</p></div></div><${Calendar}/><//>`;
  else if(r.v==='analytics')page=html`<${Analytics}/>`;
  else if(r.v==='archive')page=html`<${ArchivePage}/>`;
  else if(r.v==='settings')page=html`<${SettingsPage}/>`;
  else page=html`<${Dashboard}/>`;
  return html`<div className="shell"><${Sidebar}/><div className="main"><${Topbar}/><main className=${cls('page',flush&&'flush')}>${page}</main></div>
    ${S.openTask&&html`<${TaskPanel} key=${S.openTask} id=${S.openTask}/>`}${S.openTodo&&html`<${PersonalPanel} key=${S.openTodo.coll+'|'+S.openTodo.id} k=${S.openTodo}/>`}${S.quick&&html`<${QuickCreate} init=${S.quick}/>`}<${ModalHost}/><${Toasts}/></div>`}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
boot().catch(e=>{console.error(e);S.dbOk=false;emit()});
</script>
